name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Validate skills and marketplace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Claude Code marketplace manifest
        run: npx -y @anthropic-ai/claude-code plugin validate .
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Agent Skills spec (skills-ref)
        run: |
          pip install "git+https://github.com/agentskills/agentskills#subdirectory=skills-ref"
          for skill in skills/*/; do skills-ref validate "$skill"; done

  scripts:
    name: Check scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash examples/test-scripts.sh

  sample-app:
    name: Sample app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/sample-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/sample-app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
